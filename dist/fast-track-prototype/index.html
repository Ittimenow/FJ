<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Скоростная дорожка — Поле 1 и Поле 2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      THESIS: 48 финансовых решений образуют один читаемый маршрут; прототип отказывается от безымянных одинаковых клеток.
      OWN-WORLD: тёплое игровое полотно, путевой синий, оранжевое действие и четыре устойчивых типа клеток с буквенным кодом.
      STORY: ведущий сравнивает два поля, выбирает клетку и мгновенно понимает цену, поток, правило и состояние владения.
      FIRST VIEWPORT: переключатель полей и легенда находятся над большим игровым маршрутом; выбранная клетка раскрывается в центральной панели.
      FORM: точное расширение существующей игровой системы, заданное пользователем; concept seed не применялся.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <header class="app-shell-header">
      <div class="app-shell-bar">
        <div class="brand-logo" aria-label="Финансовое путешествие">
          <img src="../../apps/web/public/logo.svg" alt="" width="40" height="40" />
          <span><strong>Финансовое</strong><strong>путешествие</strong></span>
        </div>
        <div class="game-header-summary">
          <strong>Большой круг</strong>
          <span>Изолированный прототип</span>
        </div>
        <div class="game-header-controls" aria-label="Состояние партии">
          <span class="header-chip">Период 1/4</span>
          <span class="header-chip">Раунд 3</span>
          <span class="current-turn-chip">Ход: Анна</span>
          <span class="profile-mark" aria-label="Профиль Анны">А</span>
        </div>
      </div>
    </header>

    <main class="app-shell-main">
      <section class="game-toolbar" aria-label="Управление игровым полем">
        <div class="toolbar-copy">
          <h1>Скоростная дорожка</h1>
          <p>48 клеток · демонстрационные данные</p>
        </div>
        <div class="legend" aria-label="Типы клеток">
          <span class="legend-item type-business"><b>Б</b> Бизнес</span>
          <span class="legend-item type-dream"><b>М</b> Место</span>
          <span class="legend-item type-expense"><b>Ф</b> Расход</span>
          <span class="legend-item type-positive"><b>О</b> Положительный эффект</span>
        </div>
        <div class="view-switcher" role="group" aria-label="Вариант игрового поля">
          <button class="view-button is-active" type="button" data-view="classic" aria-pressed="true">
            <span class="view-number">1</span>
            <span><strong>Поле 1</strong><small>48 клеток</small></span>
          </button>
          <button class="view-button" type="button" data-view="journey" aria-pressed="false">
            <span class="view-number">2</span>
            <span><strong>Поле 2</strong><small>Кольцо</small></span>
          </button>
        </div>
      </section>

      <section class="board-shell" aria-label="Предпросмотр Скоростной дорожки">
        <div class="board-scroll" tabindex="0" aria-label="Игровое поле; область можно прокручивать">
          <div id="classic-board" class="board board-classic" aria-label="Поле 1, единый маршрут">
            <svg class="classic-route" viewBox="0 0 1240 706" aria-hidden="true">
              <path class="classic-route-line" d="M 620 143 H 200 V 563 H 440 V 667 H 92 Q 60 667 60 635 V 71 Q 60 39 92 39 H 1148 Q 1180 39 1180 71 V 635 Q 1180 667 1148 667 H 800 V 563 H 1040 V 143 H 620"></path>
              <text class="classic-start-label" x="594" y="98">СТАРТ</text>
              <text class="classic-transition-label classic-transition-out" x="420" y="620">11–12</text>
              <text class="classic-transition-label classic-transition-return" x="780" y="620">37–38</text>
            </svg>
          </div>
          <div id="journey-board" class="board board-journey" aria-label="Поле 2" hidden>
            <svg class="journey-route" viewBox="0 0 1200 760" aria-hidden="true">
              <ellipse cx="600" cy="380" rx="528" ry="310"></ellipse>
              <path d="M 580 706 L 600 724 L 620 706" class="route-arrow"></path>
            </svg>
          </div>
        </div>
      </section>

      <section class="mobile-detail" aria-label="Выбранная клетка на узком экране">
        <div id="mobile-detail-content"></div>
      </section>

      <div id="cell-detail-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    </main>

    <template id="detail-template">
      <article class="cell-detail">
        <div class="detail-heading">
          <span class="detail-code"></span>
          <div>
            <span class="detail-type"></span>
            <h2 class="detail-title"></h2>
          </div>
        </div>
        <dl class="detail-metrics">
        </dl>
        <p class="detail-rule"></p>
        <div class="detail-state"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
