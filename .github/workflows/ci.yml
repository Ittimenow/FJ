name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cashflow
          POSTGRES_PASSWORD: cashflow
          POSTGRES_DB: cashflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashflow -d cashflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cashflow:cashflow@localhost:5432/cashflow?schema=public
      JWT_SECRET: test-jwt-secret
      AUTH_SECRET: test-auth-secret
      NEXTAUTH_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run changes:check
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -eu

            docker run --rm -v /opt/fj:/opt/fj --entrypoint sh caddy:2-alpine -c 'chown -R 1000:1000 /opt/fj'
            cd /opt/fj
            git pull --ff-only
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            export GITHUB_RUN_NUMBER="${{ github.run_number }}"
            export GITHUB_SHA="${{ github.sha }}"
            docker compose --env-file .env.vps -f docker-compose.vps.yml up -d --build --wait --wait-timeout 180
            docker compose --env-file .env.vps -f docker-compose.vps.yml exec -T app \
              wget -qO- http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'

            docker compose --env-file .env.vps -f docker-compose.vps.yml exec -T app \
              head -n 2 /app/.game-release-version
            docker image prune -f
